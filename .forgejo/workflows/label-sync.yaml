---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths: [".forgejo/labels.yaml"]
  schedule:
    - cron: "0 0 * * *" # Every day at midnight

permissions:
  contents: read

jobs:
  main:
    name: Label Sync - Sync Labels
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .forgejo/labels.yaml
          persist-credentials: false

      - name: Sync Labels
        uses: https://github.com/EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        env:
          # The runner-injected GITHUB_API_URL (built from our internal
          # forgejo-http:3000 service address, no scheme) trips a bug in
          # this action's URL parsing: it mis-detects the port's colon as
          # IPv6 and brackets the whole host+path, producing
          # https://[forgejo-http...:3000/api/v1]/... -> ERR_INVALID_URL.
          # A clean, schemed, standard-port URL sidesteps it.
          GITHUB_API_URL: https://git.eviljungle.com/api/v1
        with:
          config-file: .forgejo/labels.yaml
          # Start non-destructive: EndBug/label-sync drives octokit against
          # GITHUB_API_URL, which Forgejo points at itself, but this is
          # unverified against Forgejo's label API. Flip to true once a run
          # has been reviewed and matches the GitHub Actions version.
          delete-other-labels: false
