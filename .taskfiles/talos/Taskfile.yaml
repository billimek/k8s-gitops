---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  generate-secrets:
    desc: Render secrets.yaml for topf from 1Password
    preconditions:
      - which op envsubst
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml.tpl
      - test -f {{.SETUP_DIR}}/talos/secrets.env
      - op user get --me
    cmds:
      - op run --env-file {{.SETUP_DIR}}/talos/secrets.env --no-masking -- sh -c
        'envsubst < {{.SETUP_DIR}}/talos/secrets.yaml.tpl > {{.SETUP_DIR}}/talos/secrets.yaml'

  render-clusterconfig:
    desc: Render Talos machine configs locally for validation (no apply)
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/topf.yaml
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    dir: "{{.SETUP_DIR}}/talos"
    cmds:
      - topf render -o ./render-output

  generate-talosconfig:
    desc: Generate talosconfig from the secrets bundle
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/topf.yaml
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    dir: "{{.SETUP_DIR}}/talos"
    cmds:
      - topf talosconfig > "{{.TALOSCONFIG}}"

  apply-clusterconfig:
    desc: Apply clusterconfig for a Talos cluster
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/topf.yaml
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    dir: "{{.SETUP_DIR}}/talos"
    cmds:
      - topf apply {{ if eq "true" .DRY_RUN }}--dry-run{{ end }}

  apply-node:
    desc: Apply Talos config to a node [NODE=required]
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    requires:
      vars:
        - NODE
    dir: "{{.SETUP_DIR}}/talos"
    cmds:
      - topf apply --nodes-filter "^{{.NODE}}$" {{ if eq "true" .DRY_RUN }}--dry-run{{ end }}

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    requires:
      vars:
        - NODE
    vars:
      MODE: '{{.MODE | default "powercycle"}}'
    dir: "{{.SETUP_DIR}}/talos"
    cmds:
      - topf upgrade --nodes-filter "^{{.NODE}}$" --reboot-mode={{.MODE}}

  upgrade-k8s:
    desc: Upgrade Kubernetes across the whole cluster
    preconditions:
      - talosctl --nodes {{.NODE}} get machineconfig
      - which jq talosctl
    vars:
      NODE:
        sh: talosctl --talosconfig "{{.TALOSCONFIG}}" config info --output json | jq --exit-status --raw-output '.endpoints[]' | shuf -n 1
    cmds:
      - talosctl --nodes {{.NODE}} upgrade-k8s --to $KUBERNETES_VERSION

  # TODO: talosctl reboot doesn't appear to cordon and drain the node prior to rebooting - it just immediatley reboots. Not sure if this is going to be a problem.
  reboot-node:
    desc: Reboot Talos on a single node [NODE=required] [MODE=powercycle]
    preconditions:
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl
    requires:
      vars:
        - NODE
    vars:
      MODE: '{{.MODE | default "powercycle"}}'
    cmds:
      - talosctl --nodes {{.NODE}} reboot --mode={{.MODE}}

  reboot-cluster:
    desc: Reboot Talos nodes one at a time across the whole cluster [MODE=powercycle]
    preconditions:
      - which jq talosctl
    vars:
      NODE_LIST:
        sh: talosctl --talosconfig "{{.TALOSCONFIG}}" config info --output json | jq --exit-status --raw-output '.nodes[]' | sort -r
      MODE: '{{.MODE | default "powercycle"}}'
    prompt: Reboot all Talos nodes one by one ... continue?
    cmds:
      - for:
          var: NODE_LIST
        task: reboot-node
        vars:
          NODE: "{{.ITEM}}"
          MODE: "{{.MODE}}"

  shutdown-cluster:
    desc: Shutdown Talos across the whole cluster
    preconditions:
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl
    vars:
      NODES:
        sh: talosctl --talosconfig "{{.TALOSCONFIG}}" config info --output json | jq --exit-status --join-output '[.nodes[]] | join(",")'
    prompt: Shutdown the Talos cluster ... continue?
    cmds:
      - talosctl shutdown --nodes {{.NODES}} --force

  reset-node:
    desc: Reset Talos on a single node [NODE=required]
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    requires:
      vars:
        - NODE
    dir: "{{.SETUP_DIR}}/talos"
    prompt: Reset Talos node '{{.NODE}}' ... continue?
    cmds:
      - topf reset --nodes-filter "^{{.NODE}}$"

  reset-cluster:
    desc: Reset Talos across the whole cluster
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    dir: "{{.SETUP_DIR}}/talos"
    prompt: Reset the Talos cluster ... continue?
    cmds:
      - topf reset

  kubeconfig:
    desc: Generate the kubeconfig for a Talos cluster
    preconditions:
      - which topf
      - test -f {{.SETUP_DIR}}/talos/secrets.yaml
    dir: "{{.SETUP_DIR}}/talos"
    cmds:
      - topf kubeconfig --validity 8760h0m0s > "{{.KUBECONFIG}}"
