---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kei-rules
  namespace: default
spec:
  groups:
    - name: kei.rules
      rules:
        - alert: KeiSyncFailing
          annotations:
            description: kei download transfers are failing ({{ $value }} in the last 2h). Check iCloud credentials or network connectivity.
            summary: kei iCloud sync is failing.
          expr: increase(kei_sync_failed_total[2h]) > 0
          for: 15m
          labels:
            severity: warning

        - alert: KeiSyncDown
          annotations:
            description: kei has {{ $value }} assets permanently stuck in the failed state. The download pipeline cannot make progress.
            summary: kei iCloud sync is critically failing.
          expr: kei_db_assets_total{status="failed"} > 0
          for: 30m
          labels:
            severity: critical

        - alert: KeiNoRecentSync
          annotations:
            description: kei has not completed a successful iCloud sync in over 2 hours (last success was {{ $value | humanizeDuration }} ago), or has never synced since the pod started (last_success_timestamp still 0).
            summary: kei has not synced recently.
          # kei_health_last_success_timestamp_seconds == 0 means "no success since boot",
          # not "no data yet" (kei#719: PrimarySync checkpoint can stay stuck for days
          # without ever recording a success). Gate on process uptime instead of dropping
          # the epoch-0 case outright, so a genuinely fresh boot still gets a grace period.
          expr: |
            (
              ((time() - kei_health_last_success_timestamp_seconds) > 7200)
              and (kei_health_last_success_timestamp_seconds > 0)
            )
            or
            (
              (kei_health_last_success_timestamp_seconds == 0)
              and on() (time() - max(kube_pod_start_time{namespace="default", pod=~"kei-.*"}) > 7200)
            )
          for: 5m
          labels:
            severity: warning

        - alert: KeiEnumerationErrors
          annotations:
            description: kei has had repeated CloudKit enumeration shortfalls over the past 6 hours. This may indicate a persistent iCloud zone issue.
            summary: kei iCloud enumeration is consistently incomplete.
          expr: increase(kei_sync_enumeration_errors_total[6h]) > 3
          for: 30m
          labels:
            severity: warning

        - alert: KeiSessionExpired
          annotations:
            description: An iCloud session expiration was detected. Manual 2FA re-authentication may be required.
            summary: kei iCloud session expired.
          expr: increase(kei_sync_session_expirations_total[1h]) > 0
          for: 0m
          labels:
            severity: warning

        - alert: KeiCheckpointBlocked
          annotations:
            description: kei's iCloud sync checkpoint has been blocked for {{ $value }} cycles in the last 3 hours instead of advancing. Downloads may still succeed but incremental progress is not being committed (kei#719).
            summary: kei sync checkpoint is stuck, not advancing.
          expr: increase(kei_sync_token_blocked_cycles_total[3h]) > 2
          for: 30m
          labels:
            severity: warning

        - alert: KeiStateWriteFailures
          annotations:
            description: kei failed to durably persist sync state {{ $value }} times in the last hour. This can escalate a blocked checkpoint from a proof issue to a state-write issue.
            summary: kei sync state writes are failing.
          expr: increase(kei_sync_state_write_failures_total[1h]) > 0
          for: 0m
          labels:
            severity: warning
