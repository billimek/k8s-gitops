---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: recyclarr
  namespace: default
spec:
  interval: 30m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 9.0.0
  url: oci://ghcr.io/recyclarr/charts/recyclarr
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-keys
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: recyclarr-keys
  data:
    - secretKey: RECYCLARR_API_KEY
      remoteRef:
        key: recyclarr
        property: api_key
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: recyclarr
        property: radarr_api_key
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: recyclarr
        property: sonarr_api_key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    apiKey:
      existingSecret: recyclarr-keys
      existingSecretKey: RECYCLARR_API_KEY
    configs:
      existingConfigMap: recyclarr-configmap
    settings:
      content: |
        server:
          schedule:
            cron: "0 0 * * *"
    env:
      - name: TZ
        value: America/New_York
    envFrom:
      - secretRef:
          name: recyclarr-keys
    persistence:
      state:
        existingClaim: recyclarr-config
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
