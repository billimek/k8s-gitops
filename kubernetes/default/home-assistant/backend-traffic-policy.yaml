---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# Route-level BackendTrafficPolicy for home-assistant.
# Overrides the global policy to omit responseOverride rules which convert
# HTTP error responses (403/404/500/etc) into 302 redirects. The Home
# Assistant iOS Companion app requires raw status codes on /api and /auth.
# The home-assistant-code route stays on the global policy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: home-assistant
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-app
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-internal
  compressor:
    - type: Zstd
    - type: Brotli
    - type: Gzip
  healthCheck:
    passive:
      consecutiveLocalOriginFailures: 1
      interval: 1s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
        - connect-failure
  tcpKeepalive: {}
  timeout:
    http:
      connectionIdleTimeout: 4s
      requestTimeout: 0s
  # No responseOverride -- API clients need raw status codes
