---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimName: silo
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: [44]

    externalSecrets:
      silo:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: silo-secret
          template:
            data:
              SECRET_KEY: "{{ .SECRET_KEY }}"
              DATABASE_URL: "postgres://silo:{{ urlquery .SILO_POSTGRES_PASS }}@postgres-rw.default.svc.cluster.local:5432/silo"
              REDIS_URL: "redis://:{{ urlquery .VALKEY_PASSWORD }}@valkey.default.svc.cluster.local:6379/0"
        dataFrom:
          - extract:
              key: silo
          - extract:
              key: valkey

    controllers:
      silo:
        containers:
          app:
            image: &image
              repository: ghcr.io/silo-server/silo-server
              tag: latest@sha256:986b9afbf6a05435b0fd3c204832e6caaf2b1c3ff5907879a981d9731351d1c3
            env: &env
              PORT: &port 8080
              JF_PORT: &jfPort 8096
              HOME: /tmp
              SILO_METRICS_LISTEN: :9091
              SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
              SILO_TRUSTED_PROXIES: 10.244.0.0/16
            envFrom: &envFrom
              - secretRef:
                  name: silo-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

      transcode:
        type: statefulset
        replicas: 1
        statefulset:
          podManagementPolicy: Parallel
          serviceName:
            identifier: transcode
        pod:
          terminationGracePeriodSeconds: 700
          resourceClaims:
            - name: gpu
              resourceClaimName: igpu-media
        initContainers:
          wait-for-api:
            image:
              repository: busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
              - /bin/sh
              - -c
              - until wget -q -O /dev/null http://silo-app.default.svc.cluster.local:8080/api/v1/ready; do sleep 3; done
            securityContext: *securityContext
        containers:
          app:
            image: *image
            env:
              <<: *env
              MODE: transcode
              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              NODE_NAME:
                value: $(POD_NAME)
                dependsOn: POD_NAME
              NODE_URL:
                value: http://$(POD_NAME).silo-transcode.default.svc.cluster.local:8080
                dependsOn: POD_NAME
            envFrom: *envFrom
            probes:
              liveness: &nodeProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness: *nodeProbe
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext: *securityContext

    persistence:
      config:
        existingClaim: silo-config
        advancedMounts:
          silo:
            app:
              - path: /var/lib/silo
      nfs-nas-media:
        type: nfs
        server: nas.home
        path: /mnt/tank/media
        globalMounts:
          - path: /mnt/media
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

    rawResources:
      gpu:
        manifest:
          apiVersion: resource.k8s.io/v1
          kind: ResourceClaim
          spec:
            devices:
              requests:
                - name: gpu
                  exactly:
                    deviceClassName: gpu.intel.com

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://silo.eviljungle.com/api/v1/health
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - silo.eviljungle.com
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            timeouts:
              backendRequest: 3600s
      jellyfin:
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - silo-jf.eviljungle.com
        rules:
          - backendRefs:
              - identifier: app
                port: *jfPort
            timeouts:
              backendRequest: 3600s

    service:
      app:
        controller: silo
        ports:
          http:
            port: *port
          jellyfin:
            port: *jfPort
          metrics:
            port: 9091
      transcode:
        controller: transcode
        clusterIP: None
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        serviceName: silo
        endpoints:
          - port: metrics
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_name]
                targetLabel: instance
              - targetLabel: job
                replacement: silo
              - targetLabel: cluster
                replacement: home
              - targetLabel: process_role
                replacement: api
      transcode:
        serviceName: silo-transcode
        endpoints:
          - port: http
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_name]
                targetLabel: instance
              - targetLabel: job
                replacement: silo
              - targetLabel: cluster
                replacement: home
              - targetLabel: process_role
                replacement: transcode
