---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault

    externalSecrets:
      teslamate:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: teslamate-secret
          template:
            data:
              # Teslamate
              MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"
              ENCRYPTION_KEY: "{{ .TESLAMATE_ENCRYPTION_KEY }}"
              DATABASE_NAME: teslamate
              DATABASE_HOST: postgres-rw.default.svc.cluster.local
              DATABASE_PASS: "{{ .TESLAMATE_POSTGRES_PASS }}"
              DATABASE_USER: "{{ .TESLAMATE_POSTGRES_USER }}"
              # Postgres Init
              INIT_POSTGRES_DBNAME: teslamate
              INIT_POSTGRES_HOST: postgres-rw.default.svc.cluster.local
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
              INIT_POSTGRES_PASS: "{{ .TESLAMATE_POSTGRES_PASS }}"
              INIT_POSTGRES_USER: "{{ .TESLAMATE_POSTGRES_USER }}"
        dataFrom:
          - extract:
              key: teslamate
          - extract:
              key: cloudnative-pg

    controllers:
      teslamate:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: teslamate-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true

        containers:
          main:
            image:
              repository: teslamate/teslamate
              tag: 4.4.0@sha256:c85b3d447502683ed7bf12fb478e0dae9a985fe975ac22cccb64faeb4c4a5d31
            env:
              TZ: "America/New_York"
              DISABLE_MQTT: "false"
              MQTT_USERNAME: "mqtt"
              MQTT_HOST: "mosquitto"
              MQTT_HOME_ASSISTANT_DISCOVERY: "true"
            envFrom: &envFrom
              - secretRef:
                  name: teslamate-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 4000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # 4.1.0 runs a one-time Ecto migration synchronously before the
              # HTTP server starts; give it headroom on this long-lived DB.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 4000
                  initialDelaySeconds: 0
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 250Mi
              limits:
                memory: 500Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      main:
        enabled: true
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - teslamate.eviljungle.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: teslamate
                port: 4000

    service:
      main:
        controller: teslamate
        ports:
          http:
            port: 4000
