---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

    externalSecrets:
      miniflux:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: miniflux-secret
          template:
            data:
              DATABASE_URL: "postgres://miniflux:{{ urlquery .MINIFLUX_POSTGRES_PASS }}@postgres-rw.default.svc.cluster.local:5432/miniflux?sslmode=disable"
              ADMIN_USERNAME: "{{ .ADMIN_USERNAME }}"
              ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        dataFrom:
          - extract:
              key: miniflux
      mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: miniflux-mcp-secret
        data:
          - secretKey: MCP_AUTH_TOKEN
            remoteRef:
              key: miniflux
              property: MCP_AUTH_TOKEN
          - secretKey: MINIFLUX_API_KEY
            remoteRef:
              key: miniflux
              property: MINIFLUX_API_KEY

    controllers:
      miniflux:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/miniflux/miniflux
              tag: 2.3.4@sha256:72e49f513a63104506aab98ba8cfc3a409d4fde23550a583dec07ec941f1e94e
            env:
              BASE_URL: https://miniflux.eviljungle.com
              BATCH_SIZE: 100
              CLEANUP_ARCHIVE_READ_DAYS: 60
              CLEANUP_ARCHIVE_UNREAD_DAYS: 180
              CREATE_ADMIN: 1
              LOG_FORMAT: json
              METRICS_COLLECTOR: 1
              METRICS_ALLOWED_NETWORKS: 10.244.0.0/16
              POLLING_FREQUENCY: 5
              POLLING_LIMIT_PER_HOST: 5
              POLLING_SCHEDULER: entry_frequency
              PORT: &port 8080
              RUN_MIGRATIONS: 1
              SCHEDULER_ENTRY_FREQUENCY_MAX_INTERVAL: 240
              WORKER_POOL_SIZE: 5
            envFrom:
              - secretRef:
                  name: miniflux-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

      mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: jwonder/miniflux-mcp
              tag: 0.8.0@sha256:bfe785ba2918f2f12073e8fde1ef1a72c0e5d61c3655e228a3b041312d24d836
            env:
              MCP_TRANSPORT: streamable-http
              MCP_HTTP_ADDR: ":8080"
              MCP_HTTP_PATH: /mcp
              MINIFLUX_URL: http://miniflux-app.default.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: miniflux-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://miniflux.eviljungle.com/healthcheck
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - miniflux.eviljungle.com
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      mcp:
        annotations:
          gatus.home-operations.com/enabled: "false"
        parentRefs:
          - name: public
            namespace: kube-system
            sectionName: https
        hostnames:
          - miniflux-mcp.eviljungle.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            backendRefs:
              - identifier: mcp
                port: *port

    service:
      app:
        controller: miniflux
        ports:
          http:
            port: *port
      mcp:
        controller: mcp
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        serviceName: miniflux-app
        endpoints:
          - port: http
            path: /metrics
