# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-survival-secret
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minecraft-survival-secret
    template:
      data:
        RCON_PASSWORD: "{{ .rcon_password }}"
  dataFrom:
    - extract:
        key: minecraft
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-survival2-secret
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minecraft-survival2-secret
    template:
      data:
        # Used by itzg patch definitions to inject BotToken into DiscordSRV config.yml
        CFG_DISCORDSRV_TOKEN: "{{ .discordsrv_token }}"
        RCON_PASSWORD: "{{ .rcon_password }}"
  dataFrom:
    - extract:
        key: minecraft
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-creative-secret
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minecraft-creative-secret
    template:
      data:
        RCON_PASSWORD: "{{ .rcon_password }}"
  dataFrom:
    - extract:
        key: minecraft
