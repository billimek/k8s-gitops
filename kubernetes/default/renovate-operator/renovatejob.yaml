---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mogenius/renovate-operator/main/charts/renovate-operator/crd/renovate-operator.mogenius.com_renovatejobs.yaml
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: k8s-gitops
  namespace: default
spec:
  discoveryFilters:
    - billimek/k8s-gitops
  # Native forgejo platform support landed in Renovate 41.41.0; must stay >= that.
  image: ghcr.io/renovatebot/renovate:44.39.3@sha256:27f008cc48b952dff1fdceed42ef91f243f31e64596dc7f5a8754467961243ad
  parallelism: 1
  provider:
    name: forgejo
    endpoint: https://git.eviljungle.com/api/v1
  # Temporarily disabled while migrating to Forgejo; switched to a schedule
  # that never fires so GitHub's Renovate app is the sole runner again.
  schedule: "0 0 31 2 *"
  secretRef: renovate-secret
  webhook:
    enabled: false
