---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-operator
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-secret
    template:
      # See kubernetes/default/forgejo/externalsecret.yaml -- Connect strips
      # the key's trailing newline, which the real ssh-keygen CLI (used by
      # Renovate for commit signing) requires. The `|` block scalar
      # guarantees exactly one regardless of what the provider returns.
      mergePolicy: Merge
      data:
        ssh_private_key: |
          {{ .ssh_private_key }}
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: forgejo - renovate
        property: RENOVATE_TOKEN
    - secretKey: RENOVATE_GITHUB_COM_TOKEN
      remoteRef:
        key: forgejo - renovate
        property: GH_COM_TOKEN
    - secretKey: ssh_private_key
      remoteRef:
        key: forgejo renovate openssh key
        property: private key
