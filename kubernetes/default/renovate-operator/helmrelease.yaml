---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  # UI/webhook route intentionally left disabled for now -- schedule-triggered only.
  # Revisit once instant-trigger-on-push and the operator dashboard are wanted.
  values: {}
