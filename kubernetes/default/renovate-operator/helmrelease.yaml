---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    route:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/internal: "true"
        external-dns.alpha.kubernetes.io/target: "10.0.6.151"
      hostnames:
        - renovate.eviljungle.com
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
    # Webhook (instant-trigger-on-push) intentionally left disabled for now --
    # schedule-triggered only. Revisit once that's wanted.
