---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    route:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/internal: "true"
        external-dns.alpha.kubernetes.io/target: "10.0.6.151"
      hostnames:
        - renovate.eviljungle.com
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
    # Forgejo and the operator are both in-cluster, so the webhook server
    # needs no route/ingress of its own -- the chart's Service exposes its
    # port directly, and the RenovateJob points registration at that Service
    # DNS name (kubernetes/default/renovate-operator/renovatejob.yaml).
    webhook:
      enabled: true
