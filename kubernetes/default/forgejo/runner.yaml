---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

    externalSecrets:
      forgejo-runner:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: forgejo-runner-secret
          creationPolicy: Owner
        data:
          # Offline registration: generate with `openssl rand -hex 20`, then register
          # server-side with `forgejo forgejo-cli actions register --secret <token>`
          # (prints the uuid). Stored as extra fields on the existing "forgejo" item
          # rather than a separate one. See kubernetes/default/forgejo/runner.yaml
          # for how the runner consumes these.
          - secretKey: token
            remoteRef:
              key: forgejo
              property: runner_token
          - secretKey: uuid
            remoteRef:
              key: forgejo
              property: runner_uuid

    configMaps:
      config:
        data:
          runner.yaml: |
            log:
              level: info
            runner:
              # Never written: identity comes from --uuid/--token-url on the daemon command.
              file: /persistent/.runner
              capacity: 5
              timeout: 1h
              shutdown_timeout: 3m
              labels:
                - ubuntu-latest:k8s:///config/podspec-default.yaml
                - ubuntu-slim:k8s:///config/podspec-default.yaml
                - docker:k8s:///config/podspec-dind.yaml
            cache:
              enabled: true
              dir: /data/cache
            plugins:
              k8s:
                # Plugin entrypoint listens on TCP :9090, not the unix socket its --help claims.
                address: "localhost:9090"
                options:
                  namespace: default
                  poll_timeout: 10m
                  resources: |
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 1Gi
          # Podspec images are not Renovate-tracked yet - bump by hand.
          podspec-default.yaml: |-
            # Service-link env injection puts ~470 vars in job pods, which trips a
            # UPX stub bug (upx/upx#18902) that segfaults packed binaries like flate.
            enableServiceLinks: false
            containers:
              - name: main
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 4Gi
            restartPolicy: Never
          podspec-dind.yaml: |-
            # See podspec-default.yaml: keeps job-pod env small (upx/upx#18902).
            enableServiceLinks: false
            initContainers:
              - name: dind
                image: docker:29-dind@sha256:76cd6bbc3ab600fced21a7e1bea77ac00cb7c545eb95d5767e4ec4ffbcb242dc
                # Required for DinD; scoped to the per-job pod, never the runner deployment.
                securityContext:
                  privileged: true
                restartPolicy: Always
                env:
                  - name: DOCKER_TLS_CERTDIR
                    value: /certs
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 4Gi
                volumeMounts:
                  - name: docker-storage
                    mountPath: /var/lib/docker
                  - name: docker-certs
                    mountPath: /certs
                startupProbe:
                  exec:
                    command:
                      - sh
                      - -c
                      - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
                  initialDelaySeconds: 5
                  periodSeconds: 1
                  failureThreshold: 30
            containers:
              - name: main
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
                imagePullPolicy: IfNotPresent
                env:
                  - name: DOCKER_HOST
                    value: tcp://localhost:2376
                  - name: DOCKER_TLS_VERIFY
                    value: "1"
                  - name: DOCKER_CERT_PATH
                    value: /certs/client
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 2Gi
                volumeMounts:
                  - name: docker-certs
                    mountPath: /certs
                    readOnly: true
            volumes:
              - name: docker-storage
                emptyDir: {}
              - name: docker-certs
                emptyDir: {}
            restartPolicy: Never

    controllers:
      forgejo-runner:
        type: deployment
        # Must cover runner.shutdown_timeout plus the plugin's cleanup of in-flight job pods.
        pod:
          terminationGracePeriodSeconds: 300
        serviceAccount:
          identifier: forgejo-runner
        initContainers:
          # Native sidecar: must outlive the runner so job draining survives shutdown.
          plugin:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.1.0@sha256:9ae8a21340cde415b828adc95bc4f1345bed67c21a0e3be26032d367a64b20db
            restartPolicy: Always
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
        containers:
          runner:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.1.0@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner.yaml \
                  --url "http://forgejo-http.default.svc.cluster.local:3000" \
                  --uuid "$(cat /etc/forgejo-runner-secret/uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/token
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/runner.yaml
            subPath: runner.yaml
            readOnly: true
          - path: /config/podspec-default.yaml
            subPath: podspec-default.yaml
            readOnly: true
          - path: /config/podspec-dind.yaml
            subPath: podspec-dind.yaml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      runner-secret:
        type: secret
        name: forgejo-runner-secret
        advancedMounts:
          forgejo-runner:
            runner:
              - path: /etc/forgejo-runner-secret
                readOnly: true

    rbac:
      roles:
        forgejo-runner:
          type: Role
          rules:
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create", "get", "list", "watch", "delete"]
            - apiGroups: [""]
              resources: ["pods", "pods/log"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create", "get"]
      bindings:
        forgejo-runner:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner
          subjects:
            - identifier: forgejo-runner

    serviceAccount:
      forgejo-runner: {}
