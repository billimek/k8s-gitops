---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: forgejo
  namespace: default
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 17.1.5
  url: oci://code.forgejo.org/forgejo-helm/forgejo
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 1h
  values:
    replicaCount: 1
    strategy:
      type: Recreate

    podSecurityContext:
      fsGroup: 1000

    persistence:
      enabled: true
      create: true
      claimName: forgejo-config
      size: 10Gi
      storageClass: ceph-block

    gitea:
      admin:
        existingSecret: forgejo-admin
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      config:
        APP_NAME: "Forgejo"
        server:
          DOMAIN: git.eviljungle.com
          ROOT_URL: https://git.eviljungle.com/
          SSH_DOMAIN: git.eviljungle.com
        service:
          # single-admin instance; accounts for renovate/CI are created manually
          DISABLE_REGISTRATION: true
        actions:
          # Factory default (data.forgejo.org, a curated GitHub Actions
          # mirror) rewrites *any* github.com action reference through
          # itself - including fully-qualified `uses: https://github.com/...`
          # steps - and 404s on anything outside its curated set (e.g.
          # EndBug/label-sync). Point straight at github.com so our
          # .forgejo/workflows/* can reference arbitrary GitHub Actions.
          DEFAULT_ACTIONS_URL: https://github.com

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        # Reached via the internal Gateway's TCPRoute (git.eviljungle.com:22),
        # not a dedicated LoadBalancer IP - see gateway-internal.yaml.
        type: ClusterIP
        port: 22

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
