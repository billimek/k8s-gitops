---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# Route-level BackendTrafficPolicy for forgejo.
# Overrides the global policy to omit responseOverride rules which convert
# HTTP error responses (403/404/500/etc) into 302 redirects. Forgejo's own API
# clients (Renovate's forgejo platform, fj, git) require raw status codes to
# function correctly -- see #6148.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: forgejo
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: forgejo
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: forgejo-public
  compression:
    - type: Zstd
    - type: Brotli
    - type: Gzip
  healthCheck:
    passive:
      consecutiveLocalOriginFailures: 1
      interval: 1s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
        - connect-failure
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
  # No responseOverride -- API clients need raw status codes
