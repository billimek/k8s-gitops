---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: forgejo
  namespace: default
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  allowCrossNamespaceImport: true
  folder: apps
  # renovate: depName=17802
  # NOTE: PVC Storage panel is broken as shipped (its $cluster/$namespace/
  # $volume template vars are literal grafana.com onboarding placeholders,
  # not real queries) - ignore it.
  url: https://grafana.com/api/dashboards/17802/revisions/1/download
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
