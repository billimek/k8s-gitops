---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo
        property: password
    - secretKey: ed25519
      remoteRef:
        key: forgejo-signing-key
        property: private key
    - secretKey: ed25519.pub
      remoteRef:
        key: forgejo-signing-key
        property: public key
    - secretKey: SMTP_USER
      remoteRef:
        key: forgejo
        property: SMTP_USER
    - secretKey: SMTP_PASSWD
      remoteRef:
        key: forgejo
        property: SMTP_PASSWD
    - secretKey: test_private_key_openssh
      remoteRef:
        key: forgejo-signing-key
        property: notesPlain
    - secretKey: test_public_key_openssh
      remoteRef:
        key: forgejo-signing-key
        property: public_key_openssh
