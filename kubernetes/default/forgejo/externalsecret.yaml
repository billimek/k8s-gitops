---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin
    creationPolicy: Owner
    template:
      # 1Password/Connect strips the key's final trailing newline on
      # read, regardless of field/item type. Both Forgejo's own git
      # signing and Renovate's RENOVATE_GIT_PRIVATE_KEY shell out to the
      # real ssh-keygen CLI, which requires the OpenSSH key file to end in
      # a newline -- Renovate self-corrects for this in its own code, but
      # Forgejo's underlying git binary does not ("No private key
      # found"). The `|` block scalar guarantees exactly one trailing
      # newline regardless of what the provider returns.
      mergePolicy: Merge
      data:
        ed25519: |
          {{ .ed25519 }}
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo
        property: password
    - secretKey: ed25519
      remoteRef:
        key: forgejo openssh key
        # 1Password's SSH Key item type re-exports "private key" as
        # PKCS8 PEM via Connect when 1Password itself generated the key.
        # This item was instead created by importing an externally
        # generated (ssh-keygen) OpenSSH-format key, which Connect returns
        # verbatim -- OpenSSH's own ssh-keygen CLI (used by Renovate for
        # RENOVATE_GIT_PRIVATE_KEY) rejects PKCS8 as "invalid format".
        property: private key
    - secretKey: ed25519.pub
      remoteRef:
        key: forgejo openssh key
        property: public key
    - secretKey: SMTP_USER
      remoteRef:
        key: forgejo
        property: SMTP_USER
    - secretKey: SMTP_PASSWD
      remoteRef:
        key: forgejo
        property: SMTP_PASSWD
