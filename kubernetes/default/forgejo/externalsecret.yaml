---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo
        property: password
    - secretKey: ed25519
      remoteRef:
        key: forgejo-signing-key
        # notesPlain, not "private key": 1Password's SSH-Key-item-type
        # fields always re-export as PKCS8 PEM via Connect regardless of
        # input format, which OpenSSH's own ssh-keygen CLI (used by
        # Renovate for RENOVATE_GIT_PRIVATE_KEY) rejects as "invalid
        # format". Forgejo's own Go-native signing parses PKCS8 fine, but
        # storing the key in the item's plain Notes field instead keeps it
        # byte-for-byte and works for both consumers.
        property: notesPlain
    - secretKey: ed25519.pub
      remoteRef:
        key: forgejo-signing-key
        property: public_key_openssh
    - secretKey: SMTP_USER
      remoteRef:
        key: forgejo
        property: SMTP_USER
    - secretKey: SMTP_PASSWD
      remoteRef:
        key: forgejo
        property: SMTP_PASSWD
