---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin
    creationPolicy: Owner
    template:
      # 1Password's Notes field (notesPlain) strips the final trailing
      # newline on save. Both Forgejo's own git signing and Renovate's
      # RENOVATE_GIT_PRIVATE_KEY shell out to the real ssh-keygen CLI,
      # which requires the OpenSSH key file to end in a newline --
      # Renovate self-corrects for this in its own code, but Forgejo's
      # underlying git binary does not ("No private key found"). The `|`
      # block scalar guarantees exactly one trailing newline regardless of
      # what notesPlain returns.
      mergePolicy: Merge
      data:
        ed25519: |
          {{ .ed25519 }}
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo
        property: password
    - secretKey: ed25519
      remoteRef:
        key: forgejo-signing-key
        # notesPlain, not "private key": 1Password's SSH-Key-item-type
        # fields always re-export as PKCS8 PEM via Connect regardless of
        # input format, which OpenSSH's own ssh-keygen CLI rejects as
        # "invalid format". The Notes field keeps it byte-for-byte
        # (modulo the trailing newline fixed above via template).
        property: notesPlain
    - secretKey: ed25519.pub
      remoteRef:
        key: forgejo-signing-key
        property: public_key_openssh
    - secretKey: SMTP_USER
      remoteRef:
        key: forgejo
        property: SMTP_USER
    - secretKey: SMTP_PASSWD
      remoteRef:
        key: forgejo
        property: SMTP_PASSWD
    - secretKey: test_native_sshkey_item
      remoteRef:
        key: forgejo openssh key
        property: private key
