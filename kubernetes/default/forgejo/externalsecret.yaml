---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo
        property: password
    - secretKey: ed25519
      remoteRef:
        key: forgejo-signing-key
        # 1Password's SSH Key item exports "private key" as PKCS8 PEM by
        # default. Go's ssh library (Forgejo's server-side signing) parses
        # that fine, but OpenSSH's own ssh-keygen CLI (which Renovate shells
        # out to for RENOVATE_GIT_PRIVATE_KEY) rejects it as "invalid
        # format" -- request native OpenSSH format explicitly.
        property: private key?ssh-format=openssh
    - secretKey: ed25519.pub
      remoteRef:
        key: forgejo-signing-key
        property: public key
    - secretKey: SMTP_USER
      remoteRef:
        key: forgejo
        property: SMTP_USER
    - secretKey: SMTP_PASSWD
      remoteRef:
        key: forgejo
        property: SMTP_PASSWD
