---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  data:
    # Offline registration: generate with `openssl rand -hex 20`, then register
    # server-side with `forgejo forgejo-cli actions register --secret <token>`
    # (prints the uuid). Stored as extra fields on the existing "forgejo" item
    # rather than a separate one. See kubernetes/default/forgejo/runner.yaml
    # for how the runner consumes these.
    - secretKey: token
      remoteRef:
        key: forgejo
        property: runner_token
    - secretKey: uuid
      remoteRef:
        key: forgejo
        property: runner_uuid
