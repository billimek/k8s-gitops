---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      # Ensure this only runs on the control plane node
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    externalSecrets:
      etcd-backup-s3:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: etcd-backup-s3-secret
          template:
            data:
              AWS_REGION: garage
              AWS_ACCESS_KEY_ID: '{{ .TALOS_BACKUP_ACCESS_KEY }}' # garage
              AWS_SECRET_ACCESS_KEY: '{{ .TALOS_BACKUP_SECRET_KEY }}' # garage
              CUSTOM_S3_ENDPOINT: http://nas.home:3900
              BUCKET: talos-backup
              CLUSTER_NAME: home
              DISABLE_ENCRYPTION: "true"
              USE_PATH_STYLE: "true"
        dataFrom:
          - extract:
              key: garage
          - extract:
              key: talos

    controllers:
      etcd-backup:
        type: cronjob
        cronjob:
          # Run every 6 hours at 10 minutes past the hour
          schedule: "10 0/6 * * *"
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
        pod:
          restartPolicy: OnFailure
        containers:
          app:
            image:
              repository: ghcr.io/siderolabs/talos-backup
              tag: v0.1.0@sha256:3635df0be0862d71bba7a34dca3e7f7c790887f5c5d0129002191c4c2d92dd15
            command:
              - /talos-backup
            env:
              CLUSTER_NAME: home
              ENABLE_COMPRESSION: "true"
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: etcd-backup-s3-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            workingDir: /tmp

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      talos-secrets:
        type: secret
        name: etcd-backup
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
