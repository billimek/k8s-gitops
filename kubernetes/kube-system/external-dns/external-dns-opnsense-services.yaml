---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-opnsense-services
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  interval: 15m
  install:
    createNamespace: true
  values:
    # Use webhook provider for OpnSense
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/crutonjohn/external-dns-opnsense-webhook
          tag: v1@sha256:0bf02fe18db4fe3a86fe5f561313ee434a203f4dcee7d19e770f67df854f3cff
          pullPolicy: Always
        env:
          - name: OPNSENSE_API_SECRET
            valueFrom:
              secretKeyRef:
                name: opnsense-credentials
                key: OPNSENSE_API_SECRET
          - name: OPNSENSE_API_KEY
            valueFrom:
              secretKeyRef:
                name: opnsense-credentials
                key: OPNSENSE_API_KEY
          - name: OPNSENSE_HOST
            valueFrom:
              secretKeyRef:
                name: opnsense-credentials
                key: OPNSENSE_HOST
          - name: OPNSENSE_SKIP_TLS_VERIFY
            value: "true"
          - name: LOG_LEVEL
            value: "info"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: 64Mi
            cpu: 10m
          limits:
            memory: 128Mi

    # Service source only; --gateway-name cannot scope Services
    sources:
      - service

    # Only manage eviljungle.com domain
    domainFilters:
      - eviljungle.com

    # Unique identifier for this external-dns instance
    txtOwnerId: k8s-internal-svc

    # Extra arguments for external-dns
    extraArgs:
      - --annotation-filter=dns.eviljungle.com/visibility=internal

    # Policy and registry settings
    policy: sync
    registry: txt

    triggerLoopOnEvent: true

    # Resource limits
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

    interval: 5m

    # Logging
    logLevel: info

    # Metrics
    metrics:
      enabled: true
      port: 7979

    # Service monitor for Prometheus
    serviceMonitor:
      enabled: true
