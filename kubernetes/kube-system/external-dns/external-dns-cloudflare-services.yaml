---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare-services
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  interval: 15m
  install:
    createNamespace: true
  values:
    # Use Cloudflare provider
    provider:
      name: cloudflare

    policy: sync
    triggerLoopOnEvent: true

    # Service is the only source with no Gateway parentRef to filter on, so it can't share an instance with the gateway-httproute (--gateway-name) source - see external-dns docs/faq.md "annotation filters with multiple sources". This instance exists only for dns.eviljungle.com/visibility annotated Services (currently just minecraft-router's ExternalName).
    sources:
      - service

    # Only manage eviljungle.com domain
    domainFilters:
      - eviljungle.com

    # Unique identifier for this external-dns instance
    txtOwnerId: k8s-external-svc

    # Extra arguments for external-dns
    extraArgs:
      - --annotation-filter=dns.eviljungle.com/visibility=external
      - --cloudflare-proxied

    # Cloudflare configuration (using Global API Key)
    env:
      - name: CF_API_KEY
        valueFrom:
          secretKeyRef:
            name: cloudflare-credentials
            key: api-key
      - name: CF_API_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-credentials
            key: email

    # Resource limits
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

    # Update interval
    interval: 5m

    # Logging
    logLevel: info

    # Metrics
    metrics:
      enabled: true
      port: 7979

    # Service monitor for Prometheus
    serviceMonitor:
      enabled: true
