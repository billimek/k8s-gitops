---
# yaml-language-server: $schema=https://raw.githubusercontent.com/perfectra1n/volsync/main/config/crd/bases/volsync.backube_kopiamaintenances.yaml
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: kopia-maintenance
  namespace: kube-system
spec:
  repository:
    repository: kopia-maintenance-secret
  schedule: "0 */6 * * *"  # Every 6 hours
  activeDeadlineSeconds: 14400  # 4 hours for large repository first run
  moverVolumes:
    - mountPath: repository
      volumeSource:
        nfs:
          server: "nas.home"
          path: "/mnt/ssdtank/kopia"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  cacheCapacity: 10Gi
  metadataCacheSizeLimitMB: 5120  # explicit; volsync default (70% of capacity) fills the PVC to ~90%
  contentCacheSizeLimitMB: 2048
  cacheAccessModes: ["ReadWriteOnce"]
  cacheStorageClassName: ceph-block
