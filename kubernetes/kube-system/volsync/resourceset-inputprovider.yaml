---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/main/config/crd/bases/fluxcd.controlplane.io_resourcesetinputproviders.yaml
# Empty: every app has cut over to kopiur, see kopiur/resourceset-restores.yaml.
# Nothing left needs volsync-pvcs -- kubernetes/kube-system/volsync/ and
# .taskfiles/volsync/ are safe to remove entirely in a follow-up.
# To add a new app: add entry to the apps array below
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: volsync-apps
  namespace: kube-system
  labels:
    volsync.backube/managed-by: resourceset
spec:
  type: Static
  defaultValues:
    defaults:
      runAsUser: "1001"
      capacity: "1Gi"
      schedule: "0 * * * *"
      pvcSuffix: "config"
    apps: []
