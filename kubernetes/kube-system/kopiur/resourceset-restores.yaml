---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
# ResourceSet for kopiur bootstrapped PVCs.
# Creates per-app Restore (passive populator) + PVC resources.
# On cluster bootstrap: PVC auto-restores from latest snapshot.
# On fresh install with no snapshot: provisions an empty volume (onMissingSnapshot: Continue).
# App definitions are shared via the kopiur-apps ResourceSetInputProvider.
#
# CUTOVER GATE: most apps' live PVC is still owned by volsync-pvcs, whose
# dataSourceRef is immutable once bound -- kustomize.toolkit.fluxcd.io/ssa
# is a kustomize-controller concept the ResourceSet controller does not
# honor, so it does NOT protect an already-existing PVC here the way a
# Flux Kustomization would. Applying this template for an app whose PVC
# volsync-pvcs still owns fails ResourceSet reconciliation atomically for
# every app in the batch. Gate each app in with
# fluxcd.controlplane.io/reconcile below only after removing it from
# volsync/resourceset-inputprovider.yaml (which releases the PVC name).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kopiur-restores
  namespace: kube-system
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: kopiur-snapshots
      namespace: kube-system
      ready: true
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kopiur
      namespace: kube-system
      ready: true

  wait: true

  inputsFrom:
    - name: kopiur-apps

  resourcesTemplate: |
    <<- range $app := inputs.apps >>
    ---
    # Restore (passive populator) for bootstrap restore
    apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Restore
    metadata:
      name: << $app.app >>-bootstrap
      namespace: << get $app "namespace" | default "default" >>
      labels:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
      annotations:
        fluxcd.controlplane.io/reconcile: << if or (eq $app.app "shelfmark") (eq $app.app "audiobookshelf") (eq $app.app "continuwuity") (eq $app.app "frigate") (eq $app.app "gatus") (eq $app.app "home-assistant") (eq $app.app "seerr") (eq $app.app "node-red") (eq $app.app "prowlarr") (eq $app.app "qbittorrent") (eq $app.app "qui") (eq $app.app "radarr") (eq $app.app "recyclarr") (eq $app.app "sabnzbd") (eq $app.app "kei") (eq $app.app "mousetrap") (eq $app.app "minecraft-creative") (eq $app.app "minecraft-lobby") (eq $app.app "minecraft-survival") (eq $app.app "minecraft-survival2") >>enabled<< else >>disabled<< end >>
    spec:
      source:
        fromPolicy:
          name: << $app.app >>
          namespace: << get $app "namespace" | default "default" >>
      target:
        populator: {}
      policy:
        onMissingSnapshot: Continue
      # Same reasoning as the SnapshotPolicy: the repository Secret lives in
      # kube-system, restores run in the app's own namespace.
      credentialProjection:
        enabled: true
    ---
    # PVC with dataSourceRef for automatic bootstrap restore.
    # Existing PVCs are owned by the volsync-pvcs ResourceSet during the
    # migration; this template never converges on them (dataSourceRef is
    # immutable) and only ever creates a PVC on a fresh cluster/namespace.
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: << printf "%s-%s" $app.app (get $app "pvcSuffix" | default inputs.defaults.pvcSuffix) >>
      namespace: << get $app "namespace" | default "default" >>
      labels:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
      annotations:
        fluxcd.controlplane.io/prune: disabled
        fluxcd.controlplane.io/reconcile: << if eq $app.app "shelfmark" >>enabled<< else >>disabled<< end >>
    spec:
      accessModes:
        - ReadWriteOnce
      dataSourceRef:
        apiGroup: kopiur.home-operations.com
        kind: Restore
        name: << $app.app >>-bootstrap
      storageClassName: ceph-block
      resources:
        requests:
          storage: << get $app "capacity" | default inputs.defaults.capacity >>
    <<- end >>
