---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: nas.home
          path: /mnt/ssdtank/kopia
  # No `create` block: this repository already exists. Adopt it in place;
  # never risk initializing a second, empty repository at the same path.
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kube-system
      key: KOPIA_PASSWORD
  # Reproduces the fork's recorded identity (<app>@<namespace>:/data) exactly,
  # so adoption continues the existing snapshot history instead of starting a
  # parallel series. Paired with sourcePathOverride: /data on every source.
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "policyName"
  credentialProjection:
    allowed: true
  # Matches kopia.yaml's TZ so schedules/reports use local time, not UTC.
  scheduleDefaults:
    timezone: America/New_York
  catalog:
    fallbackNamespace: kube-system
    retain:
      # kopiur caps materialized discovered-Snapshot CRs at 1000 (hardcoded)
      # and truncates in identity-alphabetical order, so the tail of the app
      # list (sonarr/tautulli/unifi/zwave2mqtt) never got CRs to adopt from.
      # Keep ~29 identities x 30 comfortably under that cap.
      perIdentity: 30
  # The 6h epoch (previously matched to kopiur's default 6h quick cadence,
  # which brought this down from 4000+ index blobs) still floats 1000-1500
  # blobs between closes. Lower to 2h and pair with an explicit 3h quick
  # schedule below so epochs close - and compact - more often than backups
  # accumulate blobs across 25 apps.
  parameters:
    epoch:
      minDuration: 2h
  # The fork's maintenance mover needed a 20Gi cache to keep up with this
  # repo's index-blob volume (grown from 10Gi same-day as this migration was
  # rebased); kopiur's own auto-projected Maintenance inherits moverDefaults
  # below, whose 1Gi is sized for per-app snapshot movers, not maintenance.
  # Override it explicitly so maintenance doesn't stall on cache pressure.
  maintenance:
    # schedule requires both quick and full when set; full restates the
    # existing effective default (daily at scheduleDefaults.timezone 3am).
    schedule:
      quick:
        cron: "0 */3 * * *"
        jitter: 30m
      full:
        cron: "0 3 * * *"
        jitter: 1h
    mover:
      cache:
        capacity: 20Gi
        storageClassName: ceph-block
        metadataCacheSizeMb: 5120
        contentCacheSizeMb: 2048
  moverDefaults:
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    cache:
      capacity: 1Gi
      storageClassName: ceph-block
      # Persistent so hourly movers reuse a warm kopia index cache instead
      # of re-pulling it from NFS every run; also promotes the maintenance
      # mover's cache (spec.maintenance.mover.cache sets no mode of its own).
      mode: Persistent
    ttlSecondsAfterFinished: 300
