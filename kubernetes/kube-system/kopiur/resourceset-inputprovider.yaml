---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/main/config/crd/bases/fluxcd.controlplane.io_resourcesetinputproviders.yaml
# Consolidated ResourceSetInputProvider for all kopiur backup/restore configurations.
# Ported 1:1 from the retired volsync-apps provider; same field semantics.
# Fields with defaults (can be omitted if value matches):
#   - pvcSuffix: "config" (PVC name will be <app>-<pvcSuffix>)
#   - runAsUser: "1001"
#   - capacity: "1Gi"
#   - cacheCapacity: "1Gi"
#   - schedule: "H * * * *"
#
# Frequency: hourly by default, using Jenkins-style "H" cron substitution —
# kopiur hashes a stable, deterministic per-object minute (and, with H/N,
# hour-step offset) so load self-distributes across apps with no manual
# minute-offset bookkeeping (matches the pattern used by every kopiur
# reference implementation). 13 low-churn apps whose config rarely changes
# hour to hour (audiobookshelf, frigate, gatus, qbittorrent, recyclarr, seerr,
# tautulli, prowlarr, sabnzbd, zwave2mqtt, radarr, sonarr, unifi) are trimmed
# to every 4h ("H H/4 * * *") — this cuts both Snapshot CR volume and the
# rate of Kopia index-blob churn (see clusterrepository.yaml's
# parameters.epoch.minDuration note) for apps that don't need hourly
# recovery granularity.
# To add a new app: add entry to the apps array below
# To remove an app: delete entry from the apps array below
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: kopiur-apps
  namespace: kube-system
spec:
  type: Static
  defaultValues:
    defaults:
      runAsUser: "1001"
      capacity: "1Gi"
      cacheCapacity: "1Gi"
      schedule: "H * * * *"
      pvcSuffix: "config"
    apps:
      - app: audiobookshelf
        schedule: "H H/4 * * *"

      - app: continuwuity
        capacity: 5Gi

      - app: frigate
        runAsUser: "1000"
        schedule: "H H/4 * * *"

      - app: gatus
        namespace: "monitoring"
        runAsUser: "1000"
        schedule: "H H/4 * * *"

      - app: home-assistant
        runAsUser: "1000"
        capacity: 10Gi

      - app: kei

      - app: minecraft-creative
        pvcSuffix: "datadir"
        runAsUser: "1000"
        capacity: 10Gi

      - app: minecraft-lobby
        pvcSuffix: "datadir"
        runAsUser: "1000"
        capacity: 3Gi

      - app: minecraft-survival
        pvcSuffix: "datadir"
        runAsUser: "1000"
        capacity: 8Gi

      - app: minecraft-survival2
        pvcSuffix: "datadir"
        runAsUser: "1000"
        capacity: 20Gi
        cacheCapacity: 12Gi

      - app: mousetrap
        runAsUser: "1000"

      - app: node-red
        pvcSuffix: "data"
        runAsUser: "1000"
        capacity: 1Gi

      - app: plex
        runAsUser: "1000"
        capacity: 35Gi
        cacheCapacity: 20Gi

      - app: prowlarr
        schedule: "H H/4 * * *"

      - app: qbittorrent
        schedule: "H H/4 * * *"

      - app: qui

      - app: radarr
        capacity: 3Gi
        schedule: "H H/4 * * *"

      - app: recyclarr
        capacity: 5Gi
        schedule: "H H/4 * * *"

      - app: sabnzbd
        schedule: "H H/4 * * *"

      - app: seerr
        schedule: "H H/4 * * *"

      - app: shelfmark

      - app: sonarr
        capacity: 2Gi
        schedule: "H H/4 * * *"

      - app: tautulli
        schedule: "H H/4 * * *"

      - app: unifi
        pvcSuffix: "data"
        runAsUser: "999"
        capacity: 2Gi
        schedule: "H H/4 * * *"

      - app: zwave2mqtt
        schedule: "H H/4 * * *"
