---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-workload-rightsizing
  namespace: monitoring
data:
  workload-rightsizing.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "prometheus" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus" },
          "description": "Highest observed working set over the selected range as a fraction of the container's memory limit. Sustained values above 0.75 are candidates for a limit bump before they OOM.",
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "color-background" }, "inspect": false },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.75 },
                  { "color": "red", "value": 0.9 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Value" }]
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "max by (namespace,pod,container) (max_over_time(container_memory_working_set_bytes{container!=\"\", container!=\"POD\", namespace=~\"$namespace\"}[$__range])) / on(namespace,pod,container) group_left max by (namespace,pod,container) (kube_pod_container_resource_limits{resource=\"memory\", namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Memory headroom (peak / limit)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus" },
          "description": "Memory request minus observed peak usage. Large positive values mean the request over-books the scheduler relative to what the workload actually needs.",
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "color-background" }, "inspect": false },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 500 },
                  { "color": "red", "value": 1000 }
                ]
              },
              "unit": "decmbytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 10 },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Value" }]
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "(max by (namespace,pod,container) (kube_pod_container_resource_requests{resource=\"memory\", namespace=~\"$namespace\"}) - on(namespace,pod,container) group_left max by (namespace,pod,container) (max_over_time(container_memory_working_set_bytes{container!=\"\", container!=\"POD\", namespace=~\"$namespace\"}[$__range]))) / 1024 / 1024",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Over-provisioned memory requests",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus" },
          "description": "Containers with no memory limit at all - unbounded, first to be evicted under pressure if they also lack a request.",
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "color-background" }, "inspect": false },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "decmbytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 20 },
          "id": 3,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Value" }]
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "max by (namespace,pod,container) (max_over_time(container_memory_working_set_bytes{container!=\"\", container!=\"POD\", namespace=~\"$namespace\"}[$__range])) unless on(namespace,pod,container) kube_pod_container_resource_limits{resource=\"memory\"} / 1024 / 1024",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Containers with no memory limit (peak MiB)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus" },
          "description": "CPU throttling ratio over the last 6h. Sustained values above ~0.1 indicate a CPU request too low for the workload's actual usage.",
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "color-background" }, "inspect": false },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.05 },
                  { "color": "red", "value": 0.1 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 30 },
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Value" }]
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum by (namespace,pod,container) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\"$namespace\"}[6h])) / sum by (namespace,pod,container) (rate(container_cpu_cfs_periods_total{namespace=~\"$namespace\"}[6h])) > 0",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "CPU throttling (6h)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus" },
          "description": "OOMKilled events over the selected range, keyed off the same signal as the OomKilled alert rule.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "points",
                "fillOpacity": 0,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": false
              },
              "mappings": [],
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 40 },
          "id": 5,
          "options": {
            "legend": { "calcs": [], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "max by (namespace,pod,container) (max_over_time(kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\", namespace=~\"$namespace\"}[$__interval]))",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "title": "OOMKilled events",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "description": "Sum of memory requests on each node as a fraction of allocatable memory. High values mean the scheduler is nearly out of placeable capacity on that node.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.7 },
                  { "color": "red", "value": 0.9 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 48 },
          "id": 6,
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) / on(node) group_left sum by (node) (kube_node_status_allocatable{resource=\"memory\"})",
              "instant": true,
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "title": "Node memory request pressure",
          "type": "bargauge"
        }
      ],
      "refresh": "5m",
      "schemaVersion": 39,
      "tags": ["kubernetes", "capacity"],
      "templating": {
        "list": [
          {
            "current": { "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus" },
            "definition": "label_values(kube_pod_container_resource_limits, namespace)",
            "includeAll": true,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": { "query": "label_values(kube_pod_container_resource_limits, namespace)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "regex": "",
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-7d", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Workload Right-Sizing",
      "uid": "workload-rightsizing",
      "version": 1
    }
