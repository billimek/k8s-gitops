---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: drm-exporter-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: drm_exporter
      rules:
        - alert: DrmExporterTargetUnavailable
          expr: up{job="drm-exporter"} == 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: drm-exporter scrape target is unavailable
            description: Check the drm-exporter pod on the node and its /dev/dri and PERFMON access before treating missing GPU metrics as idle.
        - alert: GpuVideoEngineBusy
          expr: max by (cluster, node, device, engine) (drm_engine_utilization_ratio{engine="video"}) > 0.9
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: GPU video engine load is sustained above 90%
            description: Hardware transcodes on this node may be saturating the video engine. Check concurrent Plex and Silo transcodes sharing the igpu-media claim.
