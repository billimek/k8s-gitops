---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-exporter-rules
  namespace: monitoring
spec:
  groups:
    - name: speedtest-exporter.rules
      rules:
        - alert: SpeedtestExporterAbsent
          annotations:
            description: Speedtest Exporter has disappeared from Prometheus target discovery.
            summary: Speedtest Exporter is down.
          expr: |
            absent(up{job=~".*speedtest-exporter.*"} == 1)
          for: 75m
          labels:
            severity: critical
        - alert: SpeedtestSlowInternetDownload
          annotations:
            description: Best observed internet download speed over 6h is {{ humanize $value }} bytes/s.
            summary: SpeedTest slow internet download.
          expr: |
            # Aggregate across Ookla servers - some endpoints are slow, the link is not.
            max by (job) (
              max_over_time(speedtest_download_bandwidth_bytes{job=~".*speedtest-exporter.*"}[6h])
            ) < 50000000
          for: 1h
          labels:
            severity: warning
        - alert: SpeedtestSlowInternetUpload
          annotations:
            description: Best observed internet upload speed over 6h is {{ humanize $value }} bytes/s.
            summary: SpeedTest slow internet upload.
          expr: |
            # Aggregate across Ookla servers - some endpoints are slow, the link is not.
            max by (job) (
              max_over_time(speedtest_upload_bandwidth_bytes{job=~".*speedtest-exporter.*"}[6h])
            ) < 50000000
          for: 1h
          labels:
            severity: warning
        - alert: SpeedtestHighPingLatency
          annotations:
            description: Best observed internet ping latency over 6h is {{ humanize $value }} s.
            summary: SpeedTest high ping latency.
          expr: |
            # Nearest-server latency - remote test endpoints are legitimately far away.
            min by (job) (
              min_over_time(speedtest_ping_latency_seconds{job=~".*speedtest-exporter.*"}[6h])
            ) > 0.020
          for: 1h
          labels:
            severity: warning
