---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
#
# CRD-only extraction helmfile
# Usage: helmfile -f 00-crds.yaml template -q | kubectl apply --server-side -f -

helmDefaults:
  args:
    - --include-crds
    - --no-hooks
  postRenderer: bash
  postRendererArgs:
    - -c
    - yq ea -e 'select(.kind == "CustomResourceDefinition")'

releases:
  - name: prometheus-operator-crds
    namespace: monitoring
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 31.0.1

  - name: external-secrets
    namespace: kube-system
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.9.0

  - name: kopiur
    namespace: kube-system
    chart: oci://ghcr.io/home-operations/charts/kopiur
    version: 0.10.4

  - name: rook-ceph
    namespace: rook-ceph
    chart: oci://ghcr.io/rook/rook-ceph
    version: v1.20.6

  - name: cloudnative-pg
    namespace: default
    chart: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
    version: 0.29.0

  - name: envoy-gateway
    namespace: kube-system
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: 1.9.0

  - name: node-feature-discovery
    namespace: kube-system
    chart: oci://registry.k8s.io/nfd/charts/node-feature-discovery
    version: 0.19.0

  - name: silence-operator
    namespace: monitoring
    chart: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
    version: 0.20.1

  - name: snapshot-controller
    namespace: kube-system
    chart: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
    version: 5.2.0

  - name: grafana-operator
    namespace: monitoring
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.25.0

  - name: tuppr
    namespace: system-upgrade
    chart: oci://ghcr.io/home-operations/charts/tuppr
    version: 0.5.0

  - name: renovate-operator
    namespace: default
    chart: oci://ghcr.io/mogenius/helm-charts/renovate-operator
    version: 6.0.1
    # Chart installs its CRD via a Helm hook by default, which --include-crds can't
    # extract (it only reads the standard crds/ directory) -- force template mode
    # here so the bootstrap extraction finds it. The HelmRelease itself is unaffected
    # and keeps the chart default.
    set:
      - name: crd.mode
        value: template

